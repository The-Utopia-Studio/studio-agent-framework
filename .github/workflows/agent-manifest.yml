name: Agent manifest conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bakeoff/mastra/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix bakeoff/mastra --ignore-scripts
      - name: Check all skill entrypoints and references
        run: npm run check
      - name: Pipeline, manifest, structure, package and runtime regressions
        run: npm test
      - name: Build installable bundle
        run: npm run bundle
      - name: Run selected mock fixtures (not live production conformance)
        env:
          DIGEST_REAL_MODEL: '0'
          DIGEST_STORE: libsql
        run: >-
          node harness/run.js
          --manifest=examples/manifests/approval-gated-module.agent.json
          --package=bakeoff/mastra/package.json
          --lockfile=bakeoff/mastra/package-lock.json
          --adapter=bakeoff/mastra/entry.js
          --behavior
          --result="${{ runner.temp }}/agent-manifest-result.json"
          --failure-draft="${{ runner.temp }}/agent-manifest-failure-draft.json"
      - name: Preserve result and installable bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-conformance-and-bundle
          path: |
            ${{ runner.temp }}/agent-manifest-*.json
            dist/studio-agent-framework.zip
